name: GoldieHour

options:
  bundleIdPrefix: com.goldiehour
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GoldieHour:
    type: application
    platform: iOS
    sources:
      - path: GoldieHour
        excludes:
          - Resources
    resources:
      - path: GoldieHour/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldiehour.app
        PRODUCT_NAME: GoldieHour
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: GoldieHour
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: GoldieHour uses your location to show nearby places and their best light times.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false

  GoldieHourTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoldieHourTests
    dependencies:
      - target: GoldieHour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldiehour.app.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  GoldieHour:
    build:
      targets:
        GoldieHour: all
        GoldieHourTests:
          - test
    test:
      targets:
        - GoldieHourTests
